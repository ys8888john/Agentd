[project]
name = "agentd"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "agent-client-protocol>=0.12.1",
    "httpx>=0.27",
    "pydantic>=2.7",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
