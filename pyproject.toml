[project]
name = "agentd"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "agent-client-protocol>=0.12.1",
    "httpx>=0.27",
    "pydantic>=2.7",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

# 三个等价入口，都指向同一个 AgentKernel：
#   agentd / agentd-gateway / agentd-cli
# 也可以统一用 `python -m agentd [acp|gateway|cli]`。
[project.scripts]
agentd = "agentd.__main__:main"
agentd-gateway = "agentd.transports.gateway:main"
agentd-cli = "agentd.transports.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
